schema_version: 1

context:
  version: "0.4.0"

package:
  name: spharmgrid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spharmgrid/spharmgrid-${{ version }}.tar.gz
  sha256: e9756fd1049944f1e2313fd6bd3244315e76a2d0a3c2449829b602b76c3ac687

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - spharmgrid = spharmgrid.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.32.4
    - pip
  run:
    - python >=${{ python_min }}
    - ducc0 >=0.39.0
    - numpy >=1.24.0
    - xarray >=2025.1.1
  run_constraints:
    - cf-xarray >=0.10.4
    - dask-core >=2024.1.0
    - h5netcdf >=1.8.1
    - h5py >=3.11.0
    - zarr >=3.0.0
    - cfgrib >=0.9.15
    - python-eccodes >=2.48.0

tests:
  - python:
      imports:
        - spharmgrid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - spharmgrid --help

about:
  summary: Spherical harmonic tools for filtering, regridding, and kinematics in atmospheric science with Xarray, PyTorch, and JAX
  description: |
    spharmgrid (spherical harmonic gridding) implements spherical harmonic
    filtering, regridding, differential operators, and atmospheric wind
    diagnostics for global xarray fields. It computes relative vorticity,
    divergence, streamfunction, velocity potential, Helmholtz decomposition,
    and inverse wind transforms.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/spharmgrid/
  documentation: https://spharmgrid.readthedocs.io/
  repository: https://github.com/mwyau/spharmgrid

extra:
  recipe-maintainers:
    - mwyau
